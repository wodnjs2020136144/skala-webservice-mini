openapi: 3.0.3

info:
  title: 너와나의인계고리 API
  version: 1.0.0
  description: |
    간호사 교대근무의 **인계 담당 배정 · 구조화 인계 · 수신 확인 · 결원 재배정**을 다루는 병동 운영 보드.

    - 설계 범위: 국내 종합병원 병동 1곳 기준 (현직 간호사 1명 인터뷰로 확인)
    - 공식 의무기록은 EMR 이 맡고, 이 API 는 **교대 인계 메모 계층**만 다룬다. EMR 연동은 없다
    - 인증(Security Scheme)은 외부 시스템을 가정하며 이 명세의 범위 밖이다. 인가는 `users.user_type` · 소속 병동 · 인계 담당 여부로 판정한다
    - 단일 출처: **동작·상태코드는 `docs/02` T6**, **타입·제약은 `-DB.dbml`**
  license:
    name: SKALA 미니프로젝트 과제 산출물

servers:
  - url: https://api.example.local/v1
    description: 데모용 가상 서버 (실제 배포 없음)

tags:
  - name: shift
    description: 확정 근무 등록·조회 (F-01)
  - name: assignment
    description: 역할·인계 담당 배정 (F-02)
  - name: my
    description: 간호사 본인 스코프 (F-03 · F-04)
  - name: handover
    description: 구조화 인계 작성·수신 확인 (F-04)
  - name: reassignment
    description: 결원 등록 → 재배정 → 대체 완료 확인 (F-05)
  - name: template
    description: 병동 인계 항목 정의 (F-06)
  - name: dashboard
    description: 병동 대시보드 집계 (진입점)

paths:
  /wards/{wardId}/shift-assignments:
    get:
      tags: [shift]
      operationId: listShiftAssignments
      summary: 확정 근무 목록 조회
      description: 근무 등록 화면(`3_shift_register_manager`) 진입 시 그 날짜의 근무를 읽는다.
      parameters:
        - $ref: '#/components/parameters/WardId'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: shift_code
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ShiftCode' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShiftAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [shift]
      operationId: createShiftAssignments
      summary: 확정 근무 등록
      description: |
        역할은 여기서 받지 않는다(F-02 에서 배정).
        **지원 근무를 허용한다** — `users.ward_id` 와 `wardId` 가 달라도 등록할 수 있다. 권한 판정만 `users.ward_id` 로 한다.
      parameters:
        - $ref: '#/components/parameters/WardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [user_id, work_date, shift_code]
                    properties:
                      user_id: { type: string }
                      work_date: { type: string, format: date }
                      shift_code: { $ref: '#/components/schemas/ShiftCode' }
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShiftAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 같은 사람·같은 날·같은 근무조에 이미 배정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wards/{wardId}/assignment-board:
    get:
      tags: [assignment]
      operationId: getAssignmentBoard
      summary: 역할·인계 담당 배정 보드 조회
      description: 근무자별 역할·팀과, 팀 차지에게 지정된 인계 담당 입원 건을 함께 반환한다.
      parameters:
        - $ref: '#/components/parameters/WardId'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: shift_code
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ShiftCode' }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignmentBoard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shift-assignments/{shiftAssignmentId}:
    patch:
      tags: [assignment]
      operationId: updateShiftAssignmentRole
      summary: 역할 배정·변경
      description: '`role_type_id` 는 `null` 허용 — 역할 미배정 상태가 실제로 존재한다.'
      parameters:
        - $ref: '#/components/parameters/ShiftAssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_type_id]
              properties:
                role_type_id:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                type: object
                required: [shift_assignment_id]
                properties:
                  shift_assignment_id: { type: integer }
                  role_name: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`role_type.ward_id` 가 근무의 병동과 다름'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shift-assignments/{shiftAssignmentId}/handover-assignments:
    post:
      tags: [assignment]
      operationId: assignHandoverOwnership
      summary: 인계 담당 지정
      description: |
        이 근무에서 **인계를 작성·수신할 사람**을 입원 건별로 지정한다.
        역할·팀을 API 가 강제하지 않는다 — 차지 결원 시 누가 올라가는지 현장 운용이 확인되지 않았기 때문이다.
        화면은 그 근무의 팀 차지를 기본값으로 제안한다.
      parameters:
        - $ref: '#/components/parameters/ShiftAssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inpatient_stay_ids]
              properties:
                inpatient_stay_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '201':
          description: 지정 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HandoverAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 같은 근무에 같은 입원 건이 이미 `ACTIVE`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 근무의 병동과 입원 건의 병동이 다름
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wards/{wardId}/handover-template-items:
    get:
      tags: [template]
      operationId: listHandoverTemplateItems
      summary: 병동 인계 항목 조회
      description: 받는 사람의 역할과 무관한 **병동 공통 템플릿**이다.
      parameters:
        - $ref: '#/components/parameters/WardId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HandoverTemplateItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [template]
      operationId: replaceHandoverTemplateItems
      summary: 병동 인계 항목 전체 교체
      description: |
        템플릿을 고쳐도 **이미 생성된 `handover_item` 은 바뀌지 않는다**(스냅샷 불변 규칙 1).
        복사는 인계 생성 시점에 1회뿐이다.
      parameters:
        - $ref: '#/components/parameters/WardId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [label, is_required, sort_order]
                    properties:
                      label: { type: string }
                      is_required: { type: boolean }
                      sort_order: { type: integer }
      responses:
        '200':
          description: 교체 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HandoverTemplateItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: '`sort_order` 중복'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shift-assignments/{shiftAssignmentId}/reassignment-context:
    get:
      tags: [reassignment]
      operationId: getReassignmentContext
      summary: 재배정 화면 진입 조회
      description: |
        대체 후보와 함께 **결원자 이름으로 남은 인계 담당 건**(`pending_handover_assignments`)을 반환한다.
        완료 확인 가드는 대체 "근무"만 보므로, 잔여 담당은 화면이 보여주고 사람이 판단한다.
      parameters:
        - $ref: '#/components/parameters/ShiftAssignmentId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReassignmentContext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shift-assignments/{shiftAssignmentId}/absence:
    post:
      tags: [reassignment]
      operationId: registerAbsence
      summary: 결원 등록
      description: |
        수간호사가 등록한다. 자동 감지가 아니다.
        **사람이 사유를 쓰는 유일한 지점**이며, 이후 로그의 `change_reason` 은 이 값을 복사한다.
      parameters:
        - $ref: '#/components/parameters/ShiftAssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [change_reason]
              properties:
                change_reason: { type: string, minLength: 1 }
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                type: object
                required: [shift_assignment_id, status]
                properties:
                  shift_assignment_id: { type: integer }
                  status: { $ref: '#/components/schemas/ShiftStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 `ABSENT`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 사유 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shift-assignments/{shiftAssignmentId}/substitute:
    post:
      tags: [reassignment]
      operationId: assignSubstitute
      summary: 대체자 배정
      description: |
        대체자가 그 근무에 없으면 `shift_assignment` 를 생성하고, **이미 `ACTIVE` 로 있으면 그 행을 재사용한다**
        (근무 중인 액팅이 결원 차지를 대신하는 경우가 정상이다).
      parameters:
        - $ref: '#/components/parameters/ShiftAssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                substitute_user_id: { type: string }
                to_shift_assignment_id: { type: integer }
              oneOf:
                - required: [substitute_user_id]
                - required: [to_shift_assignment_id]
      responses:
        '201':
          description: 배정 성공
          content:
            application/json:
              schema:
                type: object
                required: [to_shift_assignment_id]
                properties:
                  to_shift_assignment_id: { type: integer }
                  user_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 재사용 불가 — 대체자가 그 근무에 `ABSENT` 이거나 다른 병동 근무
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 같은 병동·날짜·근무조가 아님 · 자기 자신 지정 · 복사할 결원 사유 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shift-assignments/{shiftAssignmentId}/handover-transfer:
    post:
      tags: [reassignment]
      operationId: transferHandoverOwnership
      summary: 인계 담당 이관
      description: |
        **한 트랜잭션이다.** 기존 `handover_assignment` 를 `REPLACED` 로 보존하고 새 행을 만들며,
        해당 인계를 `SUPERSEDED` 로 바꾸고 **후속 인계를 같은 트랜잭션에서 발행**한다.
        후속의 항목은 원본을 그대로 복사하고, 보내는 사람은 바뀌지 않는다.
      parameters:
        - $ref: '#/components/parameters/ShiftAssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_shift_assignment_id, inpatient_stay_ids]
              properties:
                to_shift_assignment_id: { type: integer }
                inpatient_stay_ids:
                  type: array
                  minItems: 1
                  items: { type: integer }
      responses:
        '200':
          description: 이관 성공
          content:
            application/json:
              schema:
                type: object
                required: [transferred]
                properties:
                  transferred:
                    type: array
                    items: { $ref: '#/components/schemas/HandoverTransferResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 대상 인계가 `CONFIRMED` — 이미 닫힌 고리는 대체하지 않는다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 후속 인계 생성 실패 · 같은 입원 건이 아님 · 근무 층위 불변 규칙 위반
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shift-assignments/{shiftAssignmentId}/coverage-confirmation:
    post:
      tags: [reassignment]
      operationId: confirmCoverage
      summary: 대체 완료로 확인
      description: |
        `covered_at` 은 **사람의 확인 기록**이지 자동 증명이 아니다.
        유효한 `SUBSTITUTE_ASSIGNED` 로그(같은 병동·날짜·근무조·`ACTIVE`)가 없으면 거부한다.
        `change_reason` 은 요청에서 받지 않고 결원 사유를 복사하므로 **body 가 없다**.
      parameters:
        - $ref: '#/components/parameters/ShiftAssignmentId'
      responses:
        '201':
          description: 확인 성공
          content:
            application/json:
              schema:
                type: object
                required: [shift_assignment_id, covered_at]
                properties:
                  shift_assignment_id: { type: integer }
                  status: { $ref: '#/components/schemas/ShiftStatus' }
                  covered_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 `covered_at` 이 있음 — 되돌리기 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 유효한 `SUBSTITUTE_ASSIGNED` 없음 · 복사할 `ABSENCE_REGISTERED` 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wards/{wardId}/reassignment-logs:
    get:
      tags: [reassignment]
      operationId: listReassignmentLogs
      summary: 변경 이력 조회
      description: 결원 등록 → 대체자 배정 → 담당 이관 → 완료 확인이 시간순으로 이어진다.
      parameters:
        - $ref: '#/components/parameters/WardId'
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReassignmentLog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/shifts:
    get:
      tags: [my]
      operationId: getMyShifts
      summary: 내 근무·역할·우리 팀 환자
      description: |
        인계 담당이 0건이어도 근무·역할은 보인다(읽기 3단 분리).
        `team_stays` 는 **조회 시점의 재원 건** 기준이다 — 미래 근무일의 환자 명단은 미리 알 수 없다.
        화면 버튼은 `is_handover_owner` 와 `incoming/outgoing` 으로 정한다. `role_name` 은 표시용이다.
      parameters:
        - name: from
          in: query
          required: false
          description: '생략하면 **오늘**부터.'
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: '생략하면 **다음 근무일까지** — 오늘 이후 첫 `work_date`, 없으면 오늘. 서버가 계산한다.'
          schema: { type: string, format: date }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [from, to, shifts]
                properties:
                  from:
                    type: string
                    format: date
                    description: 서버가 확정한 조회 시작일. query 를 생략했을 때 무엇으로 계산됐는지 화면이 알 수 있게 돌려준다.
                  to: { type: string, format: date }
                  shifts:
                    type: array
                    items: { $ref: '#/components/schemas/MyShift' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/handovers:
    get:
      tags: [my]
      operationId: listMyHandovers
      summary: 내 인계 이력
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [sent, received, both]
            default: both
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HandoverHistoryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /handovers:
    post:
      tags: [handover]
      operationId: createHandover
      summary: 인계 작성 시작
      description: |
        항목은 **병동 템플릿을 복사**해 만든다(스냅샷).
        받는 쪽(`to`)은 요청에서 받지 않는다 — 같은 입원 건의 **시간상 다음 `ACTIVE` 인계 담당**을 서버가 고른다
        (근무조 순서 `D → E → N`, `N` 의 다음은 다음 날 `D`). 없으면 `422`.
        보내는 쪽은 **현재 유효한 인계 담당**이어야 한다 — `REPLACED` 된 옛 배정으로는 만들 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inpatient_stay_id, from_handover_assignment_id]
              properties:
                inpatient_stay_id: { type: integer }
                from_handover_assignment_id: { type: integer }
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 인계 담당 당사자가 아님 · 배정 또는 근무가 `ACTIVE` 가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 퇴원(`CLOSED`) 건에는 신규 인계를 만들 수 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 다음 근무의 인계 담당이 아직 지정되지 않음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /handovers/{handoverId}:
    get:
      tags: [handover]
      operationId: getHandover
      summary: 인계 상세 열람
      description: |
        **읽기 3단으로 판정한다.**
        ① 수간호사 + 병동 일치
        ② `from`/`to` 인계 담당 당사자
        ③ 같은 팀·같은 근무 — 이 인계의 `from` 또는 `to` 근무가 내 `ACTIVE` 근무와 같은 병동·날짜·근무조이고,
        입원 건의 팀이 내 팀이며 `sent_at` 이 있는 경우(액팅의 참관 열람).
        입원 건만 같고 근무가 다른 **과거 인계는 열리지 않는다**. `DRAFT` 는 작성자 전용이다.
      parameters:
        - $ref: '#/components/parameters/HandoverId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /handovers/{handoverId}/items:
    patch:
      tags: [handover]
      operationId: updateHandoverItems
      summary: 인계 항목 임시저장
      parameters:
        - $ref: '#/components/parameters/HandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [handover_item_id, content]
                    properties:
                      handover_item_id: { type: integer }
                      content: { type: string, nullable: true }
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                type: object
                required: [handover_id, items]
                properties:
                  handover_id: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HandoverItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`SENT` 이후에는 항목을 고칠 수 없음 — 고칠 것이 있으면 새 인계를 쓴다'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /handovers/{handoverId}/send:
    post:
      tags: [handover]
      operationId: sendHandover
      summary: 인계 넘기기
      description: 필수 항목이 모두 채워져야 `SENT` 로 갈 수 있다.
      parameters:
        - $ref: '#/components/parameters/HandoverId'
      responses:
        '200':
          description: 전달 성공
          content:
            application/json:
              schema:
                type: object
                required: [handover_id, status, sent_at]
                properties:
                  handover_id: { type: integer }
                  status: { $ref: '#/components/schemas/HandoverStatus' }
                  sent_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 현재 상태가 `DRAFT` 가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: 필수 항목 미작성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /handovers/{handoverId}/receipt:
    post:
      tags: [handover]
      operationId: createHandoverReceipt
      summary: 인계 열람 기록
      description: |
        수신자가 화면을 연 시각(`received_at`)을 남긴다. **이것만으로는 확인 완료가 아니다.**
        조회(`GET`)에 쓰기 부작용을 두지 않으려고 분리했다 — 그러지 않으면 수간호사·액팅의 열람도 수신 기록이 된다.
      parameters:
        - $ref: '#/components/parameters/HandoverId'
      responses:
        '201':
          description: 기록 성공
          content:
            application/json:
              schema:
                type: object
                required: [handover_id, received_at]
                properties:
                  handover_id: { type: integer }
                  received_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 현재 상태가 `SENT` 가 아님 — `DRAFT`(전달 전) · `CONFIRMED`(종결) · `SUPERSEDED`(읽기 전용)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [handover]
      operationId: updateReceiverSummary
      summary: 수신자 요약 저장
      description: |
        받는 사람이 **핵심 내용을 자기 말로 정리**한 것이다(read-back). 단순 열람 기록과 다르다.
        확인 처리는 별도 요청이다.
      parameters:
        - $ref: '#/components/parameters/HandoverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiver_summary]
              properties:
                receiver_summary: { type: string, minLength: 1 }
      responses:
        '200':
          description: 저장 성공
          content:
            application/json:
              schema:
                type: object
                required: [handover_id, receiver_summary]
                properties:
                  handover_id: { type: integer }
                  receiver_summary: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 현재 상태가 `SENT` 가 아님 — `CONFIRMED` 이후 수정 금지 · `SUPERSEDED` 는 읽기 전용
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /handovers/{handoverId}/receipt/confirmation:
    post:
      tags: [handover]
      operationId: confirmHandoverReceipt
      summary: 수신 확인 처리
      description: |
        요약을 입력한 수신 당사자만 `CONFIRMED` 로 전이시킬 수 있다. **단순 열람은 확인 완료가 아니다.**
        되돌릴 수 없는 종결 상태다.
      parameters:
        - $ref: '#/components/parameters/HandoverId'
      responses:
        '201':
          description: 확인 성공
          content:
            application/json:
              schema:
                type: object
                required: [handover_id, status, confirmed_at]
                properties:
                  handover_id: { type: integer }
                  status: { $ref: '#/components/schemas/HandoverStatus' }
                  confirmed_at: { type: string, format: date-time }
                  receiver_summary: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 현재 상태가 `SENT` 가 아님 — `DRAFT` 도, 이미 `CONFIRMED` 도 거부
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`receiver_summary` 미입력'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /wards/{wardId}/handovers:
    get:
      tags: [dashboard]
      operationId: listWardHandovers
      summary: 병동 인계 목록 (대시보드 드릴다운)
      description: |
        대시보드의 **미확인 인계 건수**를 눌렀을 때 *어느 건인지* 보여준다.
        기본값 `status=SENT` 이 그 숫자와 같은 집합이다 — 집계와 목록이 같은 조건을 쓴다.
        `SUPERSEDED` 는 별도 상태라 기본 목록에서 자동으로 빠진다.
        수간호사 전용이다. 간호사는 `GET /me/handovers` 로 자기 것만 본다.
      parameters:
        - $ref: '#/components/parameters/WardId'
        - name: status
          in: query
          required: false
          description: '생략하면 `SENT` — 대시보드 미확인 건수와 같은 조건.'
          schema: { $ref: '#/components/schemas/HandoverStatus' }
        - name: date
          in: query
          required: false
          description: '주면 그 날짜의 근무에 걸린 인계만. 생략하면 날짜 무관(확인 대기 전부).'
          schema: { type: string, format: date }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WardHandoverItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wards/{wardId}/dashboard:
    get:
      tags: [dashboard]
      operationId: getWardDashboard
      summary: 병동 대시보드
      description: |
        4개 리소스를 합친 **화면 전용 집계 API** 다. 나누면 집계 규칙이 클라이언트로 흩어진다.
        `인계 미작성 N건` 은 제공하지 않는다 — EMR 연동이 없어 *"작성해야 했는데 안 쓴 건"* 을 셀 수 없다.
      parameters:
        - $ref: '#/components/parameters/WardId'
        - name: date
          in: query
          required: false
          description: '생략하면 **오늘**. 결원 집계는 이 날짜의 `ward_id` · `work_date` 범위로 한정된다.'
          schema: { type: string, format: date }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WardDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    WardId:
      name: wardId
      in: path
      required: true
      schema: { type: integer }
    ShiftAssignmentId:
      name: shiftAssignmentId
      in: path
      required: true
      schema: { type: integer }
    HandoverId:
      name: handoverId
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthorized:
      description: 미인증
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음 (타 병동 리소스도 `403` 으로 통일)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: HANDOVER_NOT_SENT }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    ShiftCode:
      type: string
      enum: [D, E, N]
      description: 데이 07:00-15:00 · 이브닝 14:00-22:00 · 나이트 22:00-08:00
    ShiftStatus:
      type: string
      enum: [ACTIVE, ABSENT]
    HandoverStatus:
      type: string
      enum: [DRAFT, SENT, CONFIRMED, SUPERSEDED]
      description: '`SUPERSEDED` 는 수신자 결원으로 대체된 상태이며 읽기 전용이다. 미확인 집계(`SENT`)에서 자동으로 빠진다.'
    HandoverAssignmentStatus:
      type: string
      enum: [ACTIVE, REPLACED]
    ChangeType:
      type: string
      enum: [ABSENCE_REGISTERED, SUBSTITUTE_ASSIGNED, HANDOVER_OWNER_TRANSFERRED, COVER_CONFIRMED]

    ShiftAssignment:
      type: object
      required: [shift_assignment_id, user_id, work_date, shift_code, status]
      properties:
        shift_assignment_id: { type: integer }
        user_id: { type: string }
        user_name: { type: string }
        team_name: { type: string, nullable: true }
        work_date: { type: string, format: date }
        shift_code: { $ref: '#/components/schemas/ShiftCode' }
        role_name: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        covered_at: { type: string, format: date-time, nullable: true }

    HandoverAssignment:
      type: object
      required: [handover_assignment_id, inpatient_stay_id, status]
      properties:
        handover_assignment_id: { type: integer }
        inpatient_stay_id: { type: integer }
        bed_no: { type: string }
        status: { $ref: '#/components/schemas/HandoverAssignmentStatus' }

    AssignmentBoard:
      type: object
      required: [rows, team_stays]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [shift_assignment_id, user_name, status]
            properties:
              shift_assignment_id: { type: integer }
              user_name: { type: string }
              team_name: { type: string, nullable: true }
              team_id: { type: integer, nullable: true }
              role_name: { type: string, nullable: true }
              role_type_id:
                type: integer
                nullable: true
                description: 화면의 역할 `select` 현재값. `PATCH /shift-assignments/{id}` 가 같은 값을 받는다.
              status: { $ref: '#/components/schemas/ShiftStatus' }
              handover_assignments:
                type: array
                items: { $ref: '#/components/schemas/HandoverAssignment' }
        team_stays:
          type: array
          items: { $ref: '#/components/schemas/TeamStayBrief' }

    TeamStayBrief:
      type: object
      required: [inpatient_stay_id, bed_no]
      properties:
        team_name: { type: string }
        team_id: { type: integer, nullable: true }
        inpatient_stay_id: { type: integer }
        bed_no: { type: string }

    PendingHandoverAssignment:
      type: object
      description: 결원자 이름으로 남은 `ACTIVE` 인계 담당. 화면 6 이 병상·입원 건·인계 상태를 한 줄로 보여준다.
      required: [inpatient_stay_id, bed_no, patient_ref_code, handover_status]
      properties:
        inpatient_stay_id: { type: integer }
        bed_no: { type: string }
        patient_ref_code: { type: string }
        handover_status:
          type: string
          enum: [NONE, DRAFT, SENT, CONFIRMED, SUPERSEDED]

    HandoverTemplateItem:
      type: object
      required: [id, label, is_required, sort_order]
      properties:
        id: { type: integer }
        label: { type: string }
        is_required: { type: boolean }
        sort_order: { type: integer }

    TeamStay:
      type: object
      required: [inpatient_stay_id, bed_no, patient_ref_code, admitted_at, handover_status, is_handover_owner, handover_assignment_id, incoming_handover_id, incoming_to_me, outgoing_handover_id, outgoing_status]
      properties:
        inpatient_stay_id: { type: integer }
        bed_no: { type: string }
        patient_ref_code: { type: string }
        admitted_at: { type: string, format: date-time }
        handover_status:
          type: string
          enum: [NONE, DRAFT, SENT, CONFIRMED, SUPERSEDED]
          description: 이 근무가 **받는** 인계의 상태. 없으면 `NONE`(화면 표시 "인계 없음").
        is_handover_owner:
          type: boolean
          description: 내 근무에 이 입원 건의 `ACTIVE` 인계 담당이 있으면 참.
        handover_assignment_id:
          type: integer
          nullable: true
          description: |
            내 근무의 이 입원 건 `ACTIVE` 인계 담당 id. `is_handover_owner` 가 거짓이면 `null`.
            화면 9 가 `POST /handovers` 의 `from_handover_assignment_id` 로 그대로 보낸다 —
            **화면이 요청에 넣는 식별자는 조회 응답에서 나와야 한다.**
        incoming_handover_id: { type: integer, nullable: true }
        incoming_to_me:
          type: boolean
          description: |
            `incoming_handover_id` 의 수신 당사자가 **나**이면 참.
            같은 팀·같은 근무라 **보이기만 하는 것**(읽기 3단 ③ · 액팅·역할 미배정자)과
            **내가 확인해야 하는 것**(수신 당사자)을 가른다. 화면 8 은 이 값이 참일 때만 "인계 확인" 버튼을 건다.
        outgoing_handover_id: { type: integer, nullable: true }
        outgoing_status:
          type: string
          enum: [DRAFT, SENT, CONFIRMED, SUPERSEDED]
          nullable: true
          description: '내가 보내는 인계의 상태. 없으면 `null` — 화면은 "인계 작성" 버튼을 건다.'

    MyShift:
      type: object
      required: [shift_assignment_id, work_date, shift_code, is_absent, has_reassignment, team_stays]
      properties:
        shift_assignment_id: { type: integer }
        work_date: { type: string, format: date }
        shift_code: { $ref: '#/components/schemas/ShiftCode' }
        role_name: { type: string, nullable: true }
        team_name: { type: string, nullable: true }
        is_absent: { type: boolean }
        has_reassignment:
          type: boolean
          description: 내 근무에 `SUBSTITUTE_ASSIGNED` 또는 `HANDOVER_OWNER_TRANSFERRED` 로그가 있을 때 참.
        team_stays:
          type: array
          items: { $ref: '#/components/schemas/TeamStay' }

    HandoverItem:
      type: object
      required: [handover_item_id, label, is_required, sort_order]
      properties:
        handover_item_id: { type: integer }
        label: { type: string }
        content: { type: string, nullable: true }
        is_required: { type: boolean }
        sort_order: { type: integer }

    Handover:
      type: object
      required: [handover_id, status, items]
      properties:
        handover_id: { type: integer }
        inpatient_stay_id: { type: integer }
        status: { $ref: '#/components/schemas/HandoverStatus' }
        items:
          type: array
          items: { $ref: '#/components/schemas/HandoverItem' }

    HandoverReceipt:
      type: object
      properties:
        received_at: { type: string, format: date-time, nullable: true }
        receiver_summary: { type: string, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }

    HandoverDetail:
      allOf:
        - $ref: '#/components/schemas/Handover'
        - type: object
          properties:
            bed_no: { type: string }
            patient_ref_code: { type: string }
            team_name: { type: string, nullable: true }
            created_at: { type: string, format: date-time }
            sent_at: { type: string, format: date-time, nullable: true }
            superseded_at: { type: string, format: date-time, nullable: true }
            superseded_by_handover_id:
              type: integer
              nullable: true
              description: '`SUPERSEDED` 일 때 후속 인계의 id. 화면이 원본 → 후속으로 이어 보여준다.'
            from_user_name: { type: string }
            from_work_date: { type: string, format: date }
            from_shift_code: { $ref: '#/components/schemas/ShiftCode' }
            from_role_name: { type: string, nullable: true }
            to_user_name: { type: string }
            to_work_date: { type: string, format: date }
            to_shift_code: { $ref: '#/components/schemas/ShiftCode' }
            to_role_name: { type: string, nullable: true }
            receipt: { $ref: '#/components/schemas/HandoverReceipt' }

    HandoverHistoryItem:
      type: object
      required: [handover_id, direction, status]
      properties:
        handover_id: { type: integer }
        inpatient_stay_id: { type: integer }
        bed_no: { type: string }
        patient_ref_code: { type: string }
        work_date: { type: string, format: date }
        shift_code: { $ref: '#/components/schemas/ShiftCode' }
        direction:
          type: string
          enum: [sent, received]
        status: { $ref: '#/components/schemas/HandoverStatus' }
        created_at:
          type: string
          format: date-time
          description: 목록 정렬 기준(최신 먼저). `DRAFT` 는 `sent_at` 이 없으므로 이 값으로 줄을 세운다.
        sent_at: { type: string, format: date-time, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }

    HandoverTransferResult:
      type: object
      required: [inpatient_stay_id, to_handover_assignment_id]
      properties:
        inpatient_stay_id: { type: integer }
        from_handover_assignment_id: { type: integer }
        to_handover_assignment_id: { type: integer }
        superseded_handover_id: { type: integer, nullable: true }
        successor_handover_id: { type: integer, nullable: true }

    ReassignmentContext:
      type: object
      required: [absent, candidates, pending_handover_assignments]
      properties:
        absent:
          type: object
          required: [shift_assignment_id, status]
          properties:
            shift_assignment_id: { type: integer }
            user_name: { type: string }
            team_name: { type: string, nullable: true }
            work_date: { type: string, format: date }
            shift_code: { $ref: '#/components/schemas/ShiftCode' }
            role_name: { type: string, nullable: true }
            status: { $ref: '#/components/schemas/ShiftStatus' }
            covered_at: { type: string, format: date-time, nullable: true }
            absence_reason: { type: string, nullable: true }
        candidates:
          type: array
          items:
            type: object
            required: [shift_assignment_id, user_name]
            properties:
              shift_assignment_id: { type: integer }
              user_name: { type: string }
              team_name: { type: string, nullable: true }
              role_name: { type: string, nullable: true }
        pending_handover_assignments:
          type: array
          description: 결원자 이름으로 남은 `ACTIVE` 인계 담당. 화면이 경고로 보여주고 사람이 판단한다.
          items: { $ref: '#/components/schemas/PendingHandoverAssignment' }

    ReassignmentLog:
      type: object
      required: [changed_at, change_type, change_reason]
      properties:
        changed_at: { type: string, format: date-time }
        change_type: { $ref: '#/components/schemas/ChangeType' }
        from_user_name: { type: string }
        from_work_date:
          type: string
          format: date
          description: 결원자 근무의 날짜·근무조·역할. 화면 7 타임라인이 "박○○ (9/15 E · 차지)" 처럼 한 줄로 보여준다.
        from_shift_code: { $ref: '#/components/schemas/ShiftCode' }
        from_role_name: { type: string, nullable: true }
        to_user_name: { type: string, nullable: true }
        inpatient_stay_id: { type: integer, nullable: true }
        bed_no: { type: string, nullable: true }
        patient_ref_code: { type: string, nullable: true }
        change_reason: { type: string }
        changed_by_user_name: { type: string }

    WardHandoverItem:
      type: object
      description: 대시보드 드릴다운 한 줄. 누가 보냈고 누가 받아야 하는지가 한눈에 보여야 한다.
      required: [handover_id, status, bed_no, from_user_name, to_user_name]
      properties:
        handover_id: { type: integer }
        inpatient_stay_id: { type: integer }
        bed_no: { type: string }
        patient_ref_code: { type: string }
        from_user_name: { type: string }
        to_user_name: { type: string }
        work_date:
          type: string
          format: date
          description: 보내는 쪽 근무의 날짜.
        shift_code: { $ref: '#/components/schemas/ShiftCode' }
        status: { $ref: '#/components/schemas/HandoverStatus' }
        sent_at: { type: string, format: date-time, nullable: true }

    WardDashboard:
      type: object
      required: [date, shift_counts, role_counts, unconfirmed_handover_count, uncovered_absences]
      properties:
        date:
          type: string
          format: date
          description: 이 집계의 기준 날짜. `date` query 를 생략하면 서버가 오늘로 정하므로 응답이 돌려준다.
        shift_counts:
          type: array
          items:
            type: object
            required: [shift_code, headcount]
            properties:
              shift_code: { $ref: '#/components/schemas/ShiftCode' }
              headcount: { type: integer }
        role_counts:
          type: array
          items:
            type: object
            required: [shift_code, role_name, headcount]
            properties:
              shift_code: { $ref: '#/components/schemas/ShiftCode' }
              role_name:
                type: string
                description: 역할 미배정은 `미배정` 으로 집계한다.
              headcount: { type: integer }
        unconfirmed_handover_count:
          type: integer
          description: 병동 범위에서 `status = SENT` 인 인계 수. 날짜 무관.
        uncovered_absences:
          type: array
          description: 해당 날짜의 `ABSENT` 이고 `covered_at` 이 없는 근무만.
          items:
            type: object
            required: [shift_assignment_id, user_name]
            properties:
              shift_assignment_id: { type: integer }
              user_name: { type: string }
              team_name: { type: string, nullable: true }
              work_date: { type: string, format: date }
              shift_code: { $ref: '#/components/schemas/ShiftCode' }
              role_name: { type: string, nullable: true }
              absence_reason: { type: string, nullable: true }
